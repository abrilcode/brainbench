[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "brainbench"
version = "0.1.0"
description = "A modern, browser-based interface for OpenBCI boards: live EEG, EMG and ECG, analysis, recording and streaming. Built on BrainFlow."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Abril Herrlein" }]
keywords = ["EEG", "EMG", "ECG", "OpenBCI", "BrainFlow", "BCI", "Cyton", "Ganglion", "LSL", "neuroscience"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
  "Development Status :: 4 - Beta",
]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "brainflow>=5.12",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pyserial>=3.5",
]

[project.optional-dependencies]
streaming = ["pylsl>=1.16", "python-osc>=1.8"]
dev = ["pytest>=7", "httpx>=0.27", "pylsl>=1.16", "python-osc>=1.8"]

[project.scripts]
brainbench = "brainbench.cli:main"

[project.urls]
Repository = "https://github.com/abrilcode/brainbench"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"brainbench.web" = ["static/*", "static/js/*", "static/js/widgets/*", "static/js/dialogs/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
