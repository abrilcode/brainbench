name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Python tests
        run: pytest -q
      - name: JavaScript tests
        run: node --test web-tests/*.test.mjs
      - name: Browser check
        run: |
          brainbench --no-browser --port 8800 --data-dir "$RUNNER_TEMP/bb" &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8800/api/state > /dev/null && break; sleep 1; done
          node tools/check.mjs "http://127.0.0.1:8800/?demo"
          node tools/check.mjs http://127.0.0.1:8800/ --local
